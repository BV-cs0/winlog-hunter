title: "Caída del servicio de registro de eventos"
id: 0921d089-0333-5f72-acda-a9367977c071
status: experimental
description: "Caída del servicio de registro de eventos"
author: Bryan Valenzuela
date: 2026-11-27
tags:
    - attack.t1562.002
logsource:
    product: windows
detection:
    selection:
        Channel: "Microsoft-Windows-Sysmon/Operational"
        EventID: 1
        Image|endswith: "\\WerFault.exe"
        CommandLine|re: "(?i)(?:^|\\s)-u\\s+-p\\s+\\d+\\b"
        ParentCommandLine|contains: "-s EventLog"
    condition: selection
level: high
