title: "Carga de mstscax.dll por un cliente RDP inesperado"
id: 139a6189-fbd5-5545-8069-8af90043c0c5
status: experimental
description: "El motor eleva la severidad en perfiles, ProgramData, temporales o si Signed es false."
author: Bryan Valenzuela
date: 2026-11-27
tags:
    - attack.t1021.001
logsource:
    product: windows
detection:
    selection:
        Channel: "Microsoft-Windows-Sysmon/Operational"
        EventID: 7
        ImageLoaded|endswith: "\\mstscax.dll"
        Image|exists: true
    filter:
        Image|endswith: ["\\mstsc.exe", "\\msrdc.exe", "\\rdcman.exe", "\\mremoteng.exe", "\\remotedesktop.exe", "\\windowsapp.exe", "\\msrdcw.exe"]
    condition: selection and not filter
level: low
