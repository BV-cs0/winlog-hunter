title: 'Comando de volcado de credenciales'
id: 45c4fc2c-cd86-5761-bd80-98596ca10443
status: experimental
description: 'comsvcs MiniDump, procdump contra LSASS, ntdsutil IFM, reg save de SAM/SECURITY o comandos de Mimikatz.'
references:
    - https://github.com/BV-cs0/winlog-hunter
author: Bryan Valenzuela
date: 2026-11-07
tags:
    - attack.credential-access
    - attack.t1003.001
    - attack.t1003.002
    - attack.t1003.003
logsource:
    product: windows
    category: process_creation
detection:
    selection_comsvcs:
        CommandLine|contains|all:
            - 'comsvcs'
            - 'MiniDump'
    selection_procdump:
        CommandLine|contains|all:
            - 'procdump'
            - 'lsass'
    selection_ntdsutil:
        CommandLine|contains|all:
            - 'ntdsutil'
            - 'ifm'
    selection_ntds:
        CommandLine|contains: '\ntds.dit'
    selection_reg:
        CommandLine|contains: 'reg'
        CommandLine|contains|all:
            - ' save '
            - 'HKLM\'
    selection_reg_hive:
        CommandLine|contains:
            - '\SAM'
            - '\SECURITY'
            - '\SYSTEM'
    selection_mimikatz:
        CommandLine|contains:
            - 'sekurlsa::'
            - 'lsadump::'
            - 'kerberos::golden'
            - 'privilege::debug'
    condition: selection_comsvcs or selection_procdump or selection_ntdsutil or selection_ntds or (selection_reg and selection_reg_hive) or selection_mimikatz
fields:
    - Image
    - CommandLine
    - ParentImage
    - User
falsepositives:
    - Copias de seguridad del Directorio Activo planificadas
level: critical
---
title: 'LSASS monitorizado o copia de base de Active Directory'
id: 9847e30d-3fda-4891-b6af-aa75b94d0014
status: experimental
description: 'Application 3001 de ProcessExitMonitor sobre LSASS y ESENT 325-327 sobre ntds.dit fuera de su ruta normal; una copia autorizada de AD también puede producirlo.'
author: Bryan Valenzuela
date: 2026-11-13
logsource:
    product: windows
    service: application
detection:
    selection_lsass:
        EventID: 3001
        Provider_Name: Microsoft-Windows-ProcessExitMonitor
        param1|endswith: '\lsass.exe'
    selection_ntds:
        EventID:
            - 325
            - 326
            - 327
        Provider_Name: ESENT
        Data4|endswith: '\ntds.dit'
    filter_ntds_normal:
        Data4|re: '(?i)^[a-z]:\\windows\\ntds\\ntds\.dit$|\\\$snap_[^\\]+\\windows\\ntds\\'
    condition: selection_lsass or (selection_ntds and not filter_ntds_normal)
falsepositives:
    - Diagnóstico de LSASS y copias de AD autorizadas
level: medium
# winlog-hunter: WLH-014
