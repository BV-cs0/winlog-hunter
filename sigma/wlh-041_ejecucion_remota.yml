title: "Sesión de red con IP remota"
id: e21d852c-8d50-5326-a13d-e15f7312569d
status: experimental
description: "Señal auxiliar para correlacionar las tareas."
author: Bryan Valenzuela
date: 2026-11-27
tags:
    - attack.t1053.005
name: wlh041_logon
logsource:
    product: windows
detection:
    selection:
        Channel: "Security"
        EventID: 4624
        LogonType: 3
        IpAddress|exists: true
    filter:
        IpAddress|cidr: ["127.0.0.0/8", "0.0.0.0/32", "::1/128", "::/128", "::ffff:127.0.0.0/104"]
    condition: selection and not filter
level: informational
---
title: "Tarea creada o modificada"
id: 2bd53222-073e-5616-9d96-42cc69844155
status: experimental
description: "Señal auxiliar para correlacionar las sesiones de red."
author: Bryan Valenzuela
date: 2026-11-27
tags:
    - attack.t1053.005
name: wlh041_task
logsource:
    product: windows
detection:
    selection:
        Channel: "Security"
        EventID: [4698, 4702]
    condition: selection
level: informational
---
title: "Tarea creada o modificada desde una sesión de red"
id: 5edf53d3-9d1b-5ed7-9273-b2558b7a07a6
status: experimental
description: "El backend debe normalizar TargetLogonId y SubjectLogonId. El motor correlaciona todo el intervalo disponible."
correlation:
    type: temporal_ordered
    rules: ["wlh041_logon", "wlh041_task"]
    aliases:
        LogonId:
            wlh041_logon: TargetLogonId
            wlh041_task: SubjectLogonId
    group-by: ["Computer", "LogonId"]
    timespan: 30m
level: high
---
title: "Ejecutable copiado a Windows por System"
id: 9e166afa-011a-5d13-8d0a-94be2bc989aa
status: experimental
description: "Ejecutable copiado a Windows por System"
author: Bryan Valenzuela
date: 2026-11-27
tags:
    - attack.t1570
logsource:
    product: windows
detection:
    selection:
        Channel: "Microsoft-Windows-Sysmon/Operational"
        EventID: 11
        Image: "System"
        TargetFilename|startswith: "C:\\Windows\\"
        TargetFilename|endswith: [".exe", ".dll", ".sys", ".bat", ".cmd", ".ps1", ".vbs", ".hta"]
    condition: selection
level: high
---
title: "Servicio de ejecución remota en Sysmon"
id: c7104acd-d029-5911-8588-6ddb188e406b
status: experimental
description: "Servicio de ejecución remota en Sysmon"
author: Bryan Valenzuela
date: 2026-11-27
tags:
    - attack.t1021.002
logsource:
    product: windows
detection:
    selection:
        Channel: "Microsoft-Windows-Sysmon/Operational"
        EventID: 1
        Image|re: "(?i)\\\\(?:psexesvc|paexec[^\\\\]*|remcomsvc|csexecsvc)\\.exe$"
        ParentImage|endswith: "\\services.exe"
    condition: selection
level: high
---
title: "Recurso compartido registrado por Sysmon"
id: b96a8337-453c-50bc-b196-e8ba4827419b
status: experimental
description: "Recurso compartido registrado por Sysmon"
author: Bryan Valenzuela
date: 2026-11-27
tags:
    - attack.t1021.002
logsource:
    product: windows
detection:
    selection:
        Channel: "Microsoft-Windows-Sysmon/Operational"
        EventID: 13
        TargetObject|re: "(?i)^HKLM\\\\System\\\\CurrentControlSet\\\\Services\\\\LanmanServer\\\\Shares\\\\[^\\\\]+$"
    filter:
        TargetObject|endswith: "\\Shares\\Security"
    condition: selection and not filter
level: medium
