title: "Credenciales explícitas para un equipo remoto"
id: f45af9e6-3c63-53ad-bfea-bd203c5208aa
status: experimental
description: "El motor compara también con el nombre corto del equipo."
author: Bryan Valenzuela
date: 2026-11-27
tags:
    - attack.t1021.002
logsource:
    product: windows
detection:
    selection:
        Channel: "Security"
        EventID: 4648
        ProcessName|endswith: ["\\wmic.exe", "\\powershell.exe", "\\pwsh.exe", "\\psexec.exe", "\\psexec64.exe", "\\paexec.exe", "\\sc.exe", "\\schtasks.exe", "\\reg.exe", "\\winrs.exe", "\\mmc.exe"]
        TargetServerName|exists: true
    filter:
        TargetServerName: ["-", "localhost", ".", "127.0.0.1", "::1"]
    condition: selection and not filter
level: medium
