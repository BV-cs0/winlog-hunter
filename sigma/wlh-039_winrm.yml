title: "Hijo de WinRM en 1"
id: 7d34ba81-a9bc-58bf-91c4-9b44eec53f40
status: experimental
description: "El motor asigna severidad media a herramientas de reconocimiento y rutas de usuario."
author: Bryan Valenzuela
date: 2026-11-27
tags:
    - attack.t1021.006
logsource:
    product: windows
detection:
    selection:
        Channel: "Microsoft-Windows-Sysmon/Operational"
        EventID: 1
        ParentImage|endswith: ["\\wsmprovhost.exe", "\\winrshost.exe"]
        Image|exists: true
    filter:
        Image|endswith: ["\\cmd.exe", "\\powershell.exe", "\\pwsh.exe", "\\rundll32.exe", "\\mshta.exe", "\\wscript.exe", "\\cscript.exe"]
    condition: selection and not filter
level: low
