title: "Acceso a ficheros de credenciales de navegador"
id: 6df06091-0800-5bbd-ab22-179734644a60
status: experimental
description: "Acceso a ficheros de credenciales de navegador"
author: Bryan Valenzuela
date: 2026-11-28
tags:
    - attack.t1555.003
logsource:
    product: windows
detection:
    selection:
        Channel: "Security"
        EventID: [4656, 4663]
        ObjectName|re: "(?i)\\\\(?:(?:chrome|edge|bravesoftware|opera software|opera|vivaldi)\\\\.*\\\\(?:login data|web data|cookies|local state)|firefox\\\\.*\\\\(?:logins\\.json|key4\\.db|signons\\.sqlite))$"
    filter_programas:
        ProcessName|startswith: ["C:\\Program Files\\", "C:\\Program Files (x86)\\"]
    filter_navegador:
        ProcessName|endswith: ["\\chrome.exe", "\\msedge.exe", "\\brave.exe", "\\opera.exe", "\\vivaldi.exe", "\\firefox.exe", "\\iexplore.exe"]
    condition: selection and not filter_programas and not filter_navegador
level: high
---
title: "Actividad de registro remoto para correlación"
name: wlh043_winreg
id: 9e9be616-0b0f-5d50-ad38-2aabfaa6ed08
status: experimental
description: "Correlacionar winreg con escritura administrativa por equipo y origen. Para orígenes distintos, exigir el mismo SID y los tres nombres de colmena."
author: Bryan Valenzuela
date: 2026-11-28
tags:
    - attack.t1003.002
logsource:
    product: windows
detection:
    selection:
        Channel: "Security"
        EventID: 5145
        ShareName|endswith: "\\IPC$"
        RelativeTargetName: "winreg"
    filter:
        IpAddress|cidr: ["127.0.0.0/8", "::1/128", "::ffff:127.0.0.0/104", "0.0.0.0/32", "::/128"]
    condition: selection and not filter
level: informational
---
title: "Escritura en recurso administrativo para correlación"
name: wlh043_escritura
id: d3bfbaed-be76-545e-9073-4a54570db028
status: experimental
description: "Escritura en recurso administrativo para correlación"
author: Bryan Valenzuela
date: 2026-11-28
tags:
    - attack.t1003.002
logsource:
    product: windows
detection:
    selection:
        Channel: "Security"
        EventID: 5145
        ShareName|endswith: ["\\C$", "\\ADMIN$"]
        AccessMask|re: "(?i)^0x[0-9a-f]*[2367abef]$"
    filter:
        IpAddress|cidr: ["127.0.0.0/8", "::1/128", "::ffff:127.0.0.0/104", "0.0.0.0/32", "::/128"]
    condition: selection and not filter
level: informational
