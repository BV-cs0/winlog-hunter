title: 'Office lanzando una shell'
id: d13459de-4aff-592a-8e36-6ac93d7c4dc8
status: experimental
description: 'Word, Excel, Outlook y otras aplicaciones de Office abren intérpretes de comandos o LOLBins.'
references:
    - https://github.com/BV-cs0/winlog-hunter
author: Bryan Valenzuela
date: 2026-11-07
tags:
    - attack.initial-access
    - attack.execution
    - attack.t1566.001
    - attack.t1204.002
logsource:
    product: windows
    category: process_creation
detection:
    selection_parent:
        ParentImage|endswith:
            - '\WINWORD.EXE'
            - '\EXCEL.EXE'
            - '\POWERPNT.EXE'
            - '\OUTLOOK.EXE'
            - '\MSACCESS.EXE'
            - '\ONENOTE.EXE'
            - '\MSPUB.EXE'
            - '\VISIO.EXE'
    selection_child:
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\mshta.exe'
            - '\rundll32.exe'
            - '\regsvr32.exe'
            - '\certutil.exe'
            - '\bitsadmin.exe'
            - '\schtasks.exe'
            - '\wmic.exe'
    condition: all of selection_*
fields:
    - ParentImage
    - Image
    - CommandLine
    - User
falsepositives:
    - Complementos de Office que lanzan scripts
level: high
# winlog-hunter: WLH-012
