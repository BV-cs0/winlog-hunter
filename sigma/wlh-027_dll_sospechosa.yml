title: "Carga de wwlib.dll sin firma fuera de Office"
id: fc672e33-7ce8-5cee-9a40-3c0b68cf9e08
status: experimental
description: "Carga de wwlib.dll sin firma fuera de Office"
author: Bryan Valenzuela
date: 2026-11-28
tags:
    - attack.t1574.002
logsource:
    product: windows
detection:
    selection:
        Channel: "Microsoft-Windows-Sysmon/Operational"
        EventID: 7
        ImageLoaded|endswith: "\\wwlib.dll"
        Signed: "false"
    filter:
        ImageLoaded|re: "(?i)^c:\\\\program files(?: \\(x86\\))?\\\\.*\\\\?microsoft office(?: \\d+)?\\\\"
    condition: selection and not filter
level: high
# winlog-hunter: WLH-027
