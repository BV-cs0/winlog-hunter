        Channel: "Microsoft-Windows-Sysmon/Operational"
        EventID: 7
        ImageLoaded|endswith: ["\\cdpsgshims.dll", "\\cdpsshims.dll", "\\phoneinfo.dll", "\\tsmsisrv.dll", "\\tsvipsrv.dll", "\\ualapi.dll", "\\windowscoredeviceinfo.dll", "\\wlbsctrl.dll", "\\wow64log.dll", "\\wptsextensions.dll"]
