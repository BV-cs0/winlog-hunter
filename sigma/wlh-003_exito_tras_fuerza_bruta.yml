title: Inicio de sesión fallido (secuencia)
id: b1905d32-5076-5022-9037-6ce953e94b4b
name: winlog_hunter_failed_logon_seq
status: experimental
description: Evento 4625, primer paso de la secuencia.
author: Bryan Valenzuela
date: 2026-11-07
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4625
    filter_machine:
        TargetUserName|endswith: '$'
    condition: selection and not filter_machine
