title: Inicio de sesión correcto tras fuerza bruta
id: fc1bec8c-d5a4-5d9e-9a35-b2a231f6b5ce
status: experimental
description: Fallos e inicio correcto de la misma cuenta desde el mismo origen en 30 minutos. Aproximación a WLH-003, que además exige 5 fallos previos y que el éxito llegue después (temporal_ordered no lo admiten todos los SIEM).
author: Bryan Valenzuela
date: 2026-11-07
tags:
    - attack.credential-access
    - attack.initial-access
    - attack.t1110
    - attack.t1078
correlation:
    type: temporal
    rules:
        - winlog_hunter_failed_logon_seq
        - winlog_hunter_successful_logon_seq
    group-by:
        - TargetUserName
        - IpAddress
    timespan: 30m
level: critical
# winlog-hunter: WLH-003
