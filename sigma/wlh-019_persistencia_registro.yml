title: 'Persistencia en el registro'
id: 5aa3e93b-6386-5181-bce5-fb8cfb0ca918
status: experimental
description: 'Sysmon 13: escritura en claves de arranque (Run, Winlogon, IFEO, SilentProcessExit, AppInit, LSA, COM del usuario, SAM) desde un proceso que no es un instalador.'
references:
    - https://github.com/BV-cs0/winlog-hunter
author: Bryan Valenzuela
date: 2026-11-07
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1547.001
    - attack.t1547.004
    - attack.t1546.012
    - attack.t1546.010
    - attack.t1546.015
    - attack.t1547.005
logsource:
    product: windows
    category: registry_set
detection:
    selection:
        TargetObject|contains:
            - '\CurrentVersion\Run\'
            - '\CurrentVersion\RunOnce\'
            - '\Policies\Explorer\Run\'
            - '\Winlogon\Shell'
            - '\Winlogon\Userinit'
            - '\Image File Execution Options\'
            - '\SilentProcessExit\'
            - '\Windows\AppInit_DLLs'
            - '\Shell Folders\Startup'
            - '\Session Manager\BootExecute'
            - '\Control\Lsa\Security Packages'
            - '\Control\Lsa\Authentication Packages'
            - '\Control\Lsa\Notification Packages'
            - '\Microsoft\NetSh\'
            - '_Classes\CLSID\'
    filter_ifeo_other:
        TargetObject|contains: '\Image File Execution Options\'
        TargetObject|endswith:
            - '\MitigationOptions'
            - '\UseFilter'
    filter_installers:
        Image|endswith:
            - '\msiexec.exe'
            - '\TrustedInstaller.exe'
            - '\TiWorker.exe'
            - '\services.exe'
    condition: selection and not 1 of filter_*
fields:
    - Image
    - TargetObject
    - Details
    - User
falsepositives:
    - Software que se configura para arrancar con Windows
level: high
# winlog-hunter: WLH-019
