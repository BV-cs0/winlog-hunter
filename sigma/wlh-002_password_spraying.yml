title: Inicio de sesión fallido (spraying)
id: 94b2f2ef-d69b-5ebb-a524-fad5dd932a42
name: winlog_hunter_failed_logon_spray
status: experimental
description: '4625 o fallos Kerberos 4768/4771 (0x18 y 0x6). Base para contar cuentas distintas; el backend debe normalizar FailureCode como Status si lo utiliza.'
author: Bryan Valenzuela
date: 2026-11-07
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4625
    selection_kerberos:
        EventID:
            - 4768
            - 4771
        Status:
            - '0x18'
            - '0x6'
    filter_machine:
        TargetUserName|endswith: '$'
    condition: (selection or selection_kerberos) and not filter_machine
level: informational
---
title: 'Password spraying'
id: 34c72fd8-d1ed-51e7-acf6-2a42bfbf6f7a
status: experimental
description: 'Un mismo origen falla el inicio de sesión contra cinco o más cuentas distintas en 5 minutos.'
author: Bryan Valenzuela
date: 2026-11-07
tags:
    - attack.credential-access
    - attack.t1110.003
correlation:
    type: value_count
    rules:
        - winlog_hunter_failed_logon_spray
    group-by:
        - IpAddress
    timespan: 5m
    condition:
        field: TargetUserName
        gte: 5
level: high
---
title: "Fallos de SQL Server para correlación"
name: wlh002_mssql
id: ca79b84b-2f09-56a3-bed5-5259f07544d8
status: experimental
description: "Correlacionar por cliente y equipo, con cinco cuentas Data0 distintas en cinco minutos."
author: Bryan Valenzuela
date: 2026-11-28
tags:
    - attack.t1110.003
logsource:
    product: windows
detection:
    selection:
        Channel: "Application"
        EventID: 18456
        Provider_Name|startswith: "MSSQL"
        Data2|contains: "[CLIENT:"
    condition: selection
level: informational
---
title: "Password spraying en SQL Server"
id: ff33fa59-a0e1-5259-a106-14396e71704a
status: experimental
description: "El backend debe extraer SqlClient de Data2."
correlation:
    type: value_count
    rules: [wlh002_mssql]
    group-by: [Computer, SqlClient]
    timespan: 5m
    condition:
        field: Data0
        gte: 5
level: high
# winlog-hunter: WLH-002
