title: Inicio de sesión fallido (spraying)
id: 94b2f2ef-d69b-5ebb-a524-fad5dd932a42
name: winlog_hunter_failed_logon_spray
status: experimental
description: '4625 o fallos Kerberos 4768/4771 (0x18 y 0x6). Base para contar cuentas distintas; el backend debe normalizar FailureCode como Status si lo utiliza.'
author: Bryan Valenzuela
date: 2026-11-07
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4625
    selection_kerberos:
        EventID:
            - 4768
            - 4771
        Status:
            - '0x18'
            - '0x6'
    filter_machine:
        TargetUserName|endswith: '$'
    condition: (selection or selection_kerberos) and not filter_machine
level: informational
---
title: 'Password spraying'
id: 34c72fd8-d1ed-51e7-acf6-2a42bfbf6f7a
status: experimental
description: 'Un mismo origen falla el inicio de sesión contra cinco o más cuentas distintas en 5 minutos.'
author: Bryan Valenzuela
date: 2026-11-07
tags:
    - attack.credential-access
    - attack.t1110.003
correlation:
    type: value_count
    rules:
        - winlog_hunter_failed_logon_spray
    group-by:
        - IpAddress
    timespan: 5m
    condition:
        field: TargetUserName
        gte: 5
level: high
# winlog-hunter: WLH-002
