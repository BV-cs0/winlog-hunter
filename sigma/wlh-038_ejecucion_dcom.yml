title: "Activación de MSHTA o MMC por DCOM en Sysmon"
id: b79ca12f-e8b4-5fdb-a84b-40d8e2c6383e
status: experimental
description: "Activación de MSHTA o MMC por DCOM en Sysmon"
author: Bryan Valenzuela
date: 2026-11-27
tags:
    - attack.t1021.003
logsource:
    product: windows
detection:
    selection:
        Channel: "Microsoft-Windows-Sysmon/Operational"
        EventID: 1
        Image|endswith: ["\\mshta.exe", "\\mmc.exe"]
        CommandLine|re: "(?i)(?:^|\\s)-Embedding(?:\\s|$)"
        ParentImage|endswith: "\\svchost.exe"
    filter:
        ParentCommandLine|re: "(?i)^(?!.*(?:^|\\s)-k\\s+DcomLaunch(?:\\s|$)).+"
    condition: selection and not filter
level: high
---
title: "Activación de MSHTA o MMC por DCOM en Security"
id: c56be46b-16cb-55fa-a075-0eeb67a8f506
status: experimental
description: "El motor también recupera el padre de eventos 4688 anteriores."
author: Bryan Valenzuela
date: 2026-11-27
tags:
    - attack.t1021.003
logsource:
    product: windows
detection:
    selection:
        Channel: "Security"
        EventID: 4688
        NewProcessName|endswith: ["\\mshta.exe", "\\mmc.exe"]
        CommandLine|re: "(?i)(?:^|\\s)-Embedding(?:\\s|$)"
        ParentProcessName|endswith: "\\svchost.exe"
    condition: selection
level: high
---
title: "Proceso de escritorio con conexión entrante"
id: 1515c8d3-be5f-567c-906c-44d8465aaf84
status: experimental
description: "Proceso de escritorio con conexión entrante"
author: Bryan Valenzuela
date: 2026-11-27
tags:
    - attack.t1021.003
logsource:
    product: windows
detection:
    selection:
        Channel: "Microsoft-Windows-Sysmon/Operational"
        EventID: 3
        Image|endswith: ["\\explorer.exe", "\\mshta.exe", "\\mmc.exe", "\\excel.exe", "\\winword.exe", "\\outlook.exe", "\\visio.exe"]
        Initiated: "false"
        DestinationIp|exists: true
    filter:
        DestinationIp|cidr: ["127.0.0.0/8", "0.0.0.0/32", "::1/128", "::/128", "::ffff:127.0.0.0/104"]
    condition: selection and not filter
level: high
