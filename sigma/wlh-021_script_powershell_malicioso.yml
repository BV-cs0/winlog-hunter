title: 'Script de PowerShell malicioso'
id: ed4215cf-3066-5558-af07-4e8030394779
status: experimental
description: '4104, 4103 y 800 con indicadores de credenciales, AMSI, inyección o descargas. El motor elimina backticks y pliega concatenaciones literales acotadas; Sigma no reproduce esa normalización ni la severidad contextual de las descargas administrativas.'
references:
    - https://github.com/BV-cs0/winlog-hunter
author: Bryan Valenzuela
date: 2026-11-07
tags:
    - attack.execution
    - attack.credential-access
    - attack.t1059.001
    - attack.t1003.001
    - attack.t1685
    - attack.t1558.003
    - attack.t1055
logsource:
    product: windows
    definition: 'PowerShell/Operational 4104 y 4103, o Windows PowerShell 800; mapear los nombres de campos según el backend'
detection:
    selection:
        ScriptBlockText|contains:
            - 'MiniDumpWriteDump'
            - 'Out-Minidump'
            - 'Invoke-Mimikatz'
            - 'sekurlsa::'
            - 'lsadump::'
            - 'AmsiUtils'
            - 'amsiInitFailed'
            - 'AmsiScanBuffer'
            - 'PromptForCredential'
            - 'Invoke-Kerberoast'
            - 'KerberosRequestorSecurityToken'
            - 'CreateRemoteThread'
            - 'WriteProcessMemory'
            - 'Invoke-Shellcode'
            - 'Invoke-ReflectivePEInjection'
    selection_events:
        EventID:
            - 4103
            - 4104
            - 800
        Provider_Name|contains: PowerShell
    selection_text_payload:
        Payload|re: '(?is)invoke-mimikatz|sekurlsa::|lsadump::|amsiutils|amsiinitfailed|amsiscanbuffer|minidumpwritedump|out-minidump|createremotethread|writeprocessmemory|invoke-shellcode|invoke-reflectivepeinjection|\biex\b.{0,500}download|net\.webclient.{0,500}downloadfile'
    selection_text_context:
        ContextInfo|re: '(?is)invoke-mimikatz|sekurlsa::|lsadump::|amsiutils|amsiinitfailed|minidumpwritedump|createremotethread|writeprocessmemory|\biex\b.{0,500}download|net\.webclient.{0,500}downloadfile'
    selection_text_classic:
        Data0|re: '(?is)invoke-mimikatz|sekurlsa::|lsadump::|amsiutils|amsiinitfailed|minidumpwritedump|createremotethread|writeprocessmemory|\biex\b.{0,500}download|net\.webclient.{0,500}downloadfile'
    selection_text_script:
        ScriptBlockText|re: '(?is)\biex\b.{0,500}download|net\.webclient.{0,500}downloadfile|invoke-item.{0,160}(\$env:temp|%temp%).{0,160}\.exe'
    condition: selection or (selection_events and 1 of selection_text_*)
fields:
    - ScriptBlockText
    - Path
falsepositives:
    - Herramientas de seguridad y pentesting autorizadas
level: high
# winlog-hunter: WLH-021
