title: 'Uso malicioso de binario del sistema (LOLBin)'
id: fb1726d1-b836-5b33-a576-5f59d5519002
status: experimental
description: 'Binarios legítimos con argumentos de ejecución indirecta, carga de scripts o descarga remota. FTP, msxsl, pcalua y msiexec se gradúan como medios en el motor.'
references:
    - https://github.com/BV-cs0/winlog-hunter
    - https://lolbas-project.github.io/
author: Bryan Valenzuela
date: 2026-11-07
tags:
    - attack.stealth
    - attack.execution
    - attack.t1218
    - attack.t1105
    - attack.t1197
    - attack.t1047
logsource:
    product: windows
    category: process_creation
detection:
    selection_certutil:
        Image|endswith: '\certutil.exe'
        CommandLine|contains|windash:
            - '-urlcache'
            - '-decode'
            - '-decodehex'
    selection_mshta:
        Image|endswith: '\mshta.exe'
        CommandLine|contains:
            - 'http://'
            - 'https://'
            - 'javascript:'
            - 'vbscript:'
    selection_rundll32:
        Image|endswith: '\rundll32.exe'
        CommandLine|contains:
            - 'javascript:'
            - 'http://'
            - 'https://'
            - '\Users\Public\'
            - '\AppData\'
            - '\Temp\'
    selection_regsvr32:
        Image|endswith: '\regsvr32.exe'
        CommandLine|contains:
            - 'scrobj.dll'
            - '/i:http'
    selection_bitsadmin:
        Image|endswith: '\bitsadmin.exe'
        CommandLine|contains:
            - '/transfer'
            - '/addfile'
            - '/SetNotifyCmdLine'
    selection_wmic:
        Image|endswith: '\wmic.exe'
        CommandLine|contains:
            - 'process call create'
            - '/node:'
    selection_pcalua:
        Image|endswith: '\pcalua.exe'
        CommandLine|re: '(?i)(^|\s)-a\s+'
    selection_msxsl:
        Image|endswith: '\msxsl.exe'
        CommandLine|re: '^\s*("[^"]+"|\S+)\s+("[^"]+"|\S+)\s+("[^"]+"|\S+)'
    selection_desktopimg:
        Image|endswith: '\desktopimgdownldr.exe'
        CommandLine|re: '(?i)/lockscreenurl(\s|:)'
    selection_ftp:
        Image|endswith: '\ftp.exe'
        CommandLine|re: '(?i)(^|\s)-s:'
    selection_hh:
        Image|endswith: '\hh.exe'
        CommandLine|re: '(?i)(https?://|\\\\)[^\r\n]*\.chm\b'
    selection_hh_child:
        ParentImage|endswith: '\hh.exe'
    selection_msxsl_child:
        ParentImage|endswith: '\msxsl.exe'
        Image|re: '(?i)\\(cmd|powershell|pwsh|wscript|cscript|mshta|rundll32|regsvr32|certutil|bitsadmin|schtasks|wmic)\.exe$'
    selection_wuauclt:
        Image|endswith: '\wuauclt.exe'
        CommandLine|re: '(?i)/runhandlercomserver\b'
    selection_wuauclt_child:
        ParentImage|endswith: '\wuauclt.exe'
        ParentCommandLine|re: '(?i)/runhandlercomserver\b'
        Image|re: '(?i)\\(cmd|powershell|pwsh|wscript|cscript|mshta|rundll32|regsvr32|certutil|bitsadmin|schtasks|wmic)\.exe$'
    selection_rundll32_more:
        Image|endswith: '\rundll32.exe'
        CommandLine|re: '(?i)advpack(\.dll)?\s*,\s*(launchinfsection|registerocx)|zipfldr(\.dll)?\s*,\s*routethecall|pcwutl(\.dll)?\s*,\s*launchapplication|shell32(\.dll)?\s*,\s*shellexec_rundll|\.cpl\b'
    selection_vshadow:
        Image|endswith: '\vshadow.exe'
        CommandLine|re: '(?i)(^|\s)-exec(=|\s)'
    selection_msiexec:
        Image|endswith: '\msiexec.exe'
        CommandLine|re: '(?i)https?://|(^|\s)/y(\s|$)'
    selection_wmic_xsl:
        Image|endswith: '\wmic.exe'
        CommandLine|re: '(?i)/format:\s*["'']?[^\r\n]*\.xsl\b'
    selection_control:
        Image|endswith: '\control.exe'
        CommandLine|re: '(?i)([a-z]:\\(?!windows\\(system32|syswow64)\\)|\\\\|%[^%]+%)[^\r\n]*\.cpl\b'
    selection_forced_script:
        Image|endswith:
            - '\wscript.exe'
            - '\cscript.exe'
        CommandLine|re: '(?i)/e:(vbs|vbscript|jscript|javascript)\b\s+"?[^\s"]+\.(?!(vbs|vbe|js|jse|wsf|wsh)\b)\w+'
    condition: 1 of selection_*
fields:
    - Image
    - CommandLine
    - ParentImage
    - User
falsepositives:
    - Scripts de administración que usan estas herramientas
level: high
---
title: 'Paquete MSI desde URL'
id: 12081489-c442-422c-8f0c-efcc6f680011
status: experimental
description: 'Paquetes desde URL en MsiInstaller; indicio bajo porque también los usan instaladores legítimos.'
author: Bryan Valenzuela
date: 2026-11-13
logsource:
    product: windows
    service: application
detection:
    selection_event:
        EventID:
            - 1040
            - 1042
        Provider_Name: MsiInstaller
    selection_url0:
        Data0|re: '(?i)https?://'
    selection_url1:
        Data1|re: '(?i)https?://'
    selection_package:
        PackageName|re: '(?i)https?://'
    condition: selection_event and (selection_url0 or selection_url1 or selection_package)
falsepositives:
    - Instalaciones y actualizaciones autorizadas
level: low
---
title: "Scriptlet remoto con regsvr32 o un alias"
id: 091fe89f-d1fa-59e7-a4a0-fa95138caa24
status: experimental
description: "Scriptlet remoto con regsvr32 o un alias"
author: Bryan Valenzuela
date: 2026-11-28
tags:
    - attack.t1218.010
logsource:
    product: windows
detection:
    selection:
        Channel: "Microsoft-Windows-Sysmon/Operational"
        EventID: 1
        CommandLine|re: "(?i)/i:(?:https?|\\\\\\\\).*(?:scrobj|\\.sct|\\s\\.\\\\[^\\\\\\s]+\\.dll$)"
    condition: selection
level: high
