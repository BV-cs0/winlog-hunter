title: 'Uso malicioso de binario del sistema (LOLBin)'
id: fb1726d1-b836-5b33-a576-5f59d5519002
status: experimental
description: 'certutil, mshta, rundll32, regsvr32, bitsadmin o wmic con argumentos típicos de descarga o ejecución.'
references:
    - https://github.com/BV-cs0/winlog-hunter
author: Bryan Valenzuela
date: 2026-11-07
tags:
    - attack.stealth
    - attack.execution
    - attack.t1218
    - attack.t1105
    - attack.t1197
    - attack.t1047
logsource:
    product: windows
    category: process_creation
detection:
    selection_certutil:
        Image|endswith: '\certutil.exe'
        CommandLine|contains|windash:
            - '-urlcache'
            - '-decode'
            - '-decodehex'
    selection_mshta:
        Image|endswith: '\mshta.exe'
        CommandLine|contains:
            - 'http://'
            - 'https://'
            - 'javascript:'
            - 'vbscript:'
    selection_rundll32:
        Image|endswith: '\rundll32.exe'
        CommandLine|contains:
            - 'javascript:'
            - 'http://'
            - 'https://'
            - '\Users\Public\'
            - '\AppData\'
            - '\Temp\'
    selection_regsvr32:
        Image|endswith: '\regsvr32.exe'
        CommandLine|contains:
            - 'scrobj.dll'
            - '/i:http'
    selection_bitsadmin:
        Image|endswith: '\bitsadmin.exe'
        CommandLine|contains:
            - '/transfer'
            - '/addfile'
            - '/SetNotifyCmdLine'
    selection_wmic:
        Image|endswith: '\wmic.exe'
        CommandLine|contains:
            - 'process call create'
            - '/node:'
    condition: 1 of selection_*
fields:
    - Image
    - CommandLine
    - ParentImage
    - User
falsepositives:
    - Scripts de administración que usan estas herramientas
level: high
# winlog-hunter: WLH-011
