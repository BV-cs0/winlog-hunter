---
title: "Intérprete de scripts iniciado por navegador"
id: 58d53bfe-d6cc-51dd-9094-150cab45a0d4
status: experimental
description: "Intérprete de scripts iniciado por navegador"
author: Bryan Valenzuela
date: 2026-11-28
