---
title: "Ejecución con explorer y la opción root"
id: 1135aff5-a7db-5cd5-a24c-cc13149e28d2
status: experimental
description: "Ejecución con explorer y la opción root"
author: Bryan Valenzuela
date: 2026-11-28
tags:
    - attack.t1202
logsource:
    product: windows
detection:
    selection:
        Channel: "Microsoft-Windows-Sysmon/Operational"
        EventID: 1
        Image|endswith: "\\explorer.exe"
        CommandLine|re: "(?i)/root,\\s*\"?[^\"]+\\.exe(?:[\"\\s]|$)"
    condition: selection
level: medium
---
title: "Control_RunDLL con un fichero que no es CPL"
id: 92e91549-ad23-5632-9d9f-84fd4ac276fa
status: experimental
description: "Control_RunDLL con un fichero que no es CPL"
author: Bryan Valenzuela
date: 2026-11-28
tags:
    - attack.t1218.011
logsource:
    product: windows
detection:
    selection:
        Channel: "Microsoft-Windows-Sysmon/Operational"
        EventID: 1
        Image|endswith: "\\rundll32.exe"
        CommandLine|re: "(?i)shell32\\.dll,control_rundll\\s+(?:\"[^\"]*(?<!\\.cpl)\"|\\S+(?<!\\.cpl)(?=\\s|$))"
    condition: selection
level: medium
