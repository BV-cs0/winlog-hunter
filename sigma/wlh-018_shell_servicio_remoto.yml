title: 'Shell lanzada por un servicio remoto'
id: 1bb96d33-324f-575d-9512-efa3c47e5062
status: experimental
description: 'WMI o WinRM abren cmd, PowerShell u otros intérpretes (wmiexec, Invoke-Command, winrs).'
references:
    - https://github.com/BV-cs0/winlog-hunter
author: Bryan Valenzuela
date: 2026-11-07
tags:
    - attack.execution
    - attack.lateral-movement
    - attack.t1047
    - attack.t1021.006
logsource:
    product: windows
    category: process_creation
detection:
    selection_parent:
        ParentImage|endswith:
            - '\WmiPrvSE.exe'
            - '\wsmprovhost.exe'
            - '\winrshost.exe'
    selection_child:
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\rundll32.exe'
            - '\mshta.exe'
            - '\wscript.exe'
            - '\cscript.exe'
    condition: all of selection_*
fields:
    - ParentImage
    - Image
    - CommandLine
    - User
falsepositives:
    - Gestión remota legítima con SCCM o Ansible
level: high
# winlog-hunter: WLH-018
