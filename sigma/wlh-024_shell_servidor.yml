title: 'Shell lanzada por un servidor o servicio'
id: 217d580e-5231-4146-931a-b44772ad1524
status: experimental
description: 'Hijos de servidores y servicios y activación DCOM. Excel con shell se mantiene en WLH-012 y WMI/WinRM en WLH-018 para no duplicar hallazgos.'
references:
    - https://attack.mitre.org/techniques/T1505/003/
    - https://attack.mitre.org/techniques/T1021/003/
author: Bryan Valenzuela
date: 2026-11-13
tags:
    - attack.execution
    - attack.persistence
    - attack.lateral_movement
    - attack.t1505.003
    - attack.t1190
    - attack.t1021.003
logsource:
    product: windows
    category: process_creation
detection:
    selection_parent:
        ParentImage|endswith:
            - '\w3wp.exe'
            - '\httpd.exe'
            - '\tomcat.exe'
            - '\tomcat8.exe'
            - '\tomcat9.exe'
            - '\tomcat10.exe'
            - '\php-cgi.exe'
            - '\nginx.exe'
            - '\sqlservr.exe'
            - '\spoolsv.exe'
            - '\msiexec.exe'
            - '\smss.exe'
    selection_embedded_parent:
        ParentImage|endswith:
            - '\mmc.exe'
            - '\explorer.exe'
        ParentCommandLine|re: '(?i)(^|\s)[-/]embedding(\s|$)'
    selection_child:
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\mshta.exe'
            - '\rundll32.exe'
            - '\regsvr32.exe'
            - '\certutil.exe'
            - '\bitsadmin.exe'
            - '\schtasks.exe'
            - '\wmic.exe'
    selection_activation:
        ParentImage|endswith: '\svchost.exe'
        Image|endswith:
            - '\mmc.exe'
            - '\explorer.exe'
            - '\excel.exe'
        CommandLine|re: '(?i)(^|\s)[-/]embedding(\s|$)'
    condition: ((selection_parent or selection_embedded_parent) and selection_child) or selection_activation
fields:
    - Image
    - ParentImage
    - ParentCommandLine
    - CommandLine
falsepositives:
    - Instaladores que usan shells y activaciones DCOM legítimas; severidad media en el motor
level: high
---
title: 'SQL Server habilita o ejecuta xp_cmdshell'
id: fd27c735-a982-4c09-b8aa-6c0611ad0024
status: experimental
description: 'Cambio explícito de xp_cmdshell a 1 o ejecución auditada; una administración autorizada de SQL puede usarlo.'
author: Bryan Valenzuela
date: 2026-11-13
logsource:
    product: windows
    service: application
detection:
    selection_source:
        Provider_Name|startswith: MSSQL
    selection_enable:
        EventID: 15457
        Data0: xp_cmdshell
        Data2: '1'
    filter_already_enabled:
        Data1: '1'
    selection_exec_event:
        EventID: 33205
    selection_statement:
        statement|re: '(?i)\bexec(ute)?\s+([\w\[\]]+\.){0,2}\[?xp_cmdshell\b'
    selection_data:
        Data0|re: '(?i)\bexec(ute)?\s+([\w\[\]]+\.){0,2}\[?xp_cmdshell\b'
    filter_failed:
        succeeded:
            - 'false'
            - '0'
    condition: selection_source and ((selection_enable and not filter_already_enabled) or (selection_exec_event and (selection_statement or selection_data) and not filter_failed))
falsepositives:
    - Administración autorizada de bases de datos
level: medium
---
title: "Shell interactiva iniciada por proceso del sistema"
id: fdcb9f20-bcc3-5e86-af67-e1eeaa2d6709
status: experimental
description: "Shell interactiva iniciada por proceso del sistema"
author: Bryan Valenzuela
date: 2026-11-28
tags:
    - attack.t1059
logsource:
    product: windows
detection:
    selection:
        Channel: "Microsoft-Windows-Sysmon/Operational"
        EventID: 1
        ParentImage|endswith: ["\\svchost.exe", "\\services.exe", "\\spoolsv.exe", "\\lsass.exe", "\\winlogon.exe", "\\dllhost.exe", "\\fxssvc.exe", "\\wermgr.exe", "\\rundll32.exe", "\\regsvr32.exe"]
        CommandLine|re: "(?i)^\\s*\"?(?:[a-z]:\\\\[^\"]*\\\\)?(?:cmd|powershell)(?:\\.exe)?\"?\\s*$"
    condition: selection
level: high
# winlog-hunter: WLH-024
