title: "Tarea creada con XML de usuario"
name: wlh042_tarea_creada
id: 6ac64111-048b-574e-94b5-3c579f9b7804
status: experimental
description: "Elevar a high si el mismo padre ejecuta schtasks /run para el mismo nombre de tarea en menos de cinco minutos."
author: Bryan Valenzuela
date: 2026-11-28
tags:
    - attack.t1068
logsource:
    product: windows
detection:
    selection:
        Channel: "Microsoft-Windows-Sysmon/Operational"
        EventID: 1
        Image|endswith: "\\schtasks.exe"
        CommandLine|contains|all: [" /create", " /xml "]
        CommandLine|contains: ["C:\\Users\\", "C:\\ProgramData\\", "\\Temp\\", "\\AppData\\"]
    condition: selection
level: medium
---
