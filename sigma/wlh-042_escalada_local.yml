title: "Tarea de usuario creada y ejecutada por el mismo proceso padre"
id: f2094661-2c65-48e3-b566-0208b9a2c144
status: experimental
description: "El backend debe extraer NombreTarea de la opción /tn en ambos eventos."
correlation:
    type: temporal_ordered
    rules: [wlh042_tarea_creada, wlh042_tarea_ejecutada]
    group-by: [Computer, ParentProcessGuid, NombreTarea]
    timespan: 5m
level: high
