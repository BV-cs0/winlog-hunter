title: "Shell como SYSTEM desde un padre en ruta de usuario"
id: 7bc3c9ff-c5c7-5cf8-983c-5d71f6fe40c0
status: experimental
description: "Shell como SYSTEM desde un padre en ruta de usuario"
author: Bryan Valenzuela
date: 2026-11-28
tags:
    - attack.t1134.001
logsource:
    product: windows
detection:
    selection:
        Channel: "Microsoft-Windows-Sysmon/Operational"
        EventID: 1
        Image|endswith: ["\\bitsadmin.exe", "\\certutil.exe", "\\cmd.exe", "\\cscript.exe", "\\mshta.exe", "\\powershell.exe", "\\pwsh.exe", "\\regsvr32.exe", "\\rundll32.exe", "\\schtasks.exe", "\\wmic.exe", "\\wscript.exe", "\\whoami.exe"]
        ParentImage|contains: ["C:\\Users\\", "C:\\ProgramData\\", "\\Temp\\", "\\AppData\\"]
        User: ["SYSTEM", "SISTEMA", "NT AUTHORITY\\SYSTEM", "NT AUTHORITY\\SISTEMA"]
    condition: selection
level: high
