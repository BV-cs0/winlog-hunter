title: "Acceso remoto a spoolss o efsrpc"
id: 496f16ae-ec3f-57dd-9b72-34a32cae02c2
status: experimental
description: "Acceso remoto a spoolss o efsrpc"
author: Bryan Valenzuela
date: 2026-11-28
tags:
    - attack.t1187
logsource:
    product: windows
detection:
    selection:
        Channel: "Security"
        EventID: 5145
        ShareName|endswith: "\\IPC$"
        RelativeTargetName: ["spoolss", "efsrpc"]
    filter:
        IpAddress|cidr: ["127.0.0.0/8", "::1/128", "::ffff:127.0.0.0/104", "0.0.0.0/32", "::/128"]
    condition: selection and not filter
level: medium
