---
title: "Barrido SMB de System"
id: 4de3c85a-b1a9-5d8f-91ad-4077383f2bea
status: experimental
description: "Cinco destinos SMB distintos en cinco minutos."
correlation:
    type: value_count
    rules: [wlh044_smb_saliente]
    group-by: [Computer]
    timespan: 5m
    condition:
        field: DestinationIp
        gte: 5
level: medium
---
title: "Enumeración remota de pipes"
id: 330d265b-dea4-5502-9acf-bcf030e9b67e
status: experimental
description: "Cinco pipes distintas en cinco minutos."
correlation:
    type: value_count
    rules: [wlh044_pipe]
    group-by: [Computer]
    timespan: 5m
    condition:
        field: PipeName
        gte: 5
level: medium
---
title: "Autenticación SMB en ambos sentidos con puerto en origen"
id: 07b52362-1f55-5259-9439-f5ce4d518f3f
status: experimental
description: "Conexiones entrante y saliente de System con el mismo extremo remoto."
correlation:
    type: temporal
    rules: [wlh044_smb_saliente, wlh044_smb_entrada_origen]
    aliases:
        extremo:
            wlh044_smb_saliente: DestinationIp
            wlh044_smb_entrada_origen: DestinationIp
    group-by: [Computer, extremo]
    timespan: 59s
level: medium
---
title: "Autenticación SMB en ambos sentidos con puerto en destino"
id: 4a0739bd-b064-5499-bbcb-b1c6a4cc8ccc
status: experimental
