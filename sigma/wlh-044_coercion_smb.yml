date: 2026-11-28
tags:
    - attack.t1018
logsource:
    product: windows
detection:
    selection:
        Channel: "Microsoft-Windows-Sysmon/Operational"
        EventID: 3
        Image: "System"
        Initiated: "true"
        DestinationPort: 445
    condition: selection
level: informational
